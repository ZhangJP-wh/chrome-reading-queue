<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阅读队列</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div>
      <div class="tabs" role="tablist" aria-label="队列视图">
        <button type="button" id="tabUnread" class="tab active" role="tab" aria-selected="true" data-view="unread">
          未读队列<span id="unreadCountBadge" class="tab-badge hidden"></span>
        </button>
        <button type="button" id="tabStarred" class="tab tab-star" role="tab" aria-selected="false" data-view="starred">
          星标队列<span id="starredCountBadge" class="tab-badge hidden"></span>
        </button>
        <button type="button" id="tabHistory" class="tab tab-history" role="tab" aria-selected="false" data-view="history">
          历史队列<span id="historyCountBadge" class="tab-badge hidden"></span>
        </button>
      </div>
      <p class="sub" id="statusLine">加载中…</p>
    </div>
    <label class="max-setting" title="同时打开的队列标签页上限">
      最大标签
      <select id="maxActive" aria-label="最大活动标签数">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
  </header>

  <div class="actions">
    <button type="button" id="btnOpenNext" class="btn primary">打开下一个</button>
    <button type="button" id="btnFill" class="btn">填满额度</button>
    <button type="button" id="btnRefetchTitles" class="btn muted" title="仅通过网络静默取标题，不会开标签页">补全标题</button>
    <button type="button" id="btnClearCurrent" class="btn danger hidden" hidden>清空当前队列</button>
  </div>

  <ul id="queueList" class="queue" aria-live="polite"></ul>
  <p id="emptyHint" class="empty hidden">未读队列是空的。在链接上右键 →「加入阅读队列」。点击条目可打开为当前标签。</p>

  <footer class="footer">
    未读与星标只显示未读；点「标为已读」移入历史（不打开页面），历史里可「标为未读」。点击条目仍会打开并标为已读。点 ★ 收藏。拖动 ☰ 只在当前页签内排序。
  </footer>

  <script src="popup.js"></script>
</body>
</html>
